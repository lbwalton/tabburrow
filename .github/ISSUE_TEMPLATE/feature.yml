name: Feature request
description: Suggest an idea for TabBurrow
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before opening a request, a quick check of
        [`stories/stories.json`](../../stories/stories.json) and the
        [design spec](../../docs/specs/2026-07-15-tabburrow-design.md) is
        worth it; it might already be planned or explicitly out of scope
        for v1 (section 14).

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation you're in and what's missing or awkward today.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to see happen? Rough is fine; this doesn't need to be a full spec.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds you're using today, or other approaches you thought about?
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Where does this live?
      options:
        - Popup
        - Dashboard
        - Sessions / crash restore
        - Search
        - Sync (PRO)
        - AI organize (PRO)
        - Sharing (PRO)
        - Self-hosting / docs
        - Marketing site
        - Not sure
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Anything else?
      description: Mockups, links to similar features elsewhere, or other context.
    validations:
      required: false
